name: CI

on:
    push:
        branches: [main]
        paths-ignore:
            - "docs/**"
    pull_request:
        paths-ignore:
            - "docs/**"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Check (vet + lint + test + race + build)
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { runner: ubuntu-latest, system: x86_64-linux }
                    - { runner: ubuntu-24.04-arm, system: aarch64-linux }
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=

            - name: just check
              run: nix develop --accept-flake-config -c just check

            - name: Package check
              run: nix build -L --accept-flake-config .#checks.${{ matrix.system }}.package

    vm:
        name: VM (${{ matrix.check }})
        runs-on: ubuntu-latest
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                check: [login-vm, keyring-vm, x11-session-vm]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Give the runner KVM
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm

            - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix.stubbe.dev/c/default/default
                      extra-trusted-public-keys = default:6uWvXutL9cXjV3lii+Ur5ff+ArQoG4kMBKNXWrIxhHg=
                      system-features = benchmark big-parallel kvm nixos-test

            - name: Run the check
              run: nix build -L --accept-flake-config .#checks.x86_64-linux.${{ matrix.check }}

    package:
        name: Package
        uses: ./.github/workflows/package.yml
        with:
            version: 0~git${{ github.sha }}
